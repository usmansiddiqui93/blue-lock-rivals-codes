name: Update codes & deploy

on:
  schedule:
    - cron: "7,37 * * * *"     # every 30 minutes
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the safety rail (use only after checking the log)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.tracker.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image library (share image + icons)
        run: pip install --quiet pillow

      - name: Run tests
        run: python tests/test_updater.py

      # "" on a custom domain, "/blue-lock-rivals-codes" on the github.io preview,
      # so links, robots rules and search pings are right on both.
      - name: Read Pages settings
        id: pages
        uses: actions/configure-pages@v5

      - name: Check sources for new / expired codes
        id: tracker
        if: github.event_name != 'push'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python scripts/update_codes.py ${{ inputs.force && '--force' || '' }}

      - name: Commit data changes
        if: steps.tracker.outputs.changed == 'true' || steps.tracker.outputs.state_changed == 'true'
        run: |
          git config user.name  "blr-codes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          MSG="Update codes"
          [ -n "${{ steps.tracker.outputs.added }}" ] && MSG="New code(s): ${{ steps.tracker.outputs.added }}"
          git commit -m "$MSG" || exit 0
          git push

      - name: Build site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          git pull --ff-only || true
          export LAST_CHECKED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Emails subscribers about any code that's now live but hasn't been announced yet.
  # Safe to run every time: each code is emailed at most once (tracked in the database).
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send new-code emails
        run: |
          EP=$(python3 -c "import json;print(json.load(open('data/site.json')).get('alerts_endpoint',''))")
          if [ -z "$EP" ]; then echo "Email alerts not configured yet - skipping."; exit 0; fi
          sleep 20   # let GitHub Pages finish publishing the new codes feed
          curl -sS --fail-with-body -X POST "$EP/notify" || echo "::warning::Alert endpoint returned an error"

